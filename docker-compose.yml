services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: jonas
      POSTGRES_PASSWORD: jonas
      POSTGRES_DB: jonas_os
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - jonas_pg:/var/lib/postgresql/data

volumes:
  jonas_pg:
